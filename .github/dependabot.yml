# Actions are pinned to commit SHAs (a tag can be moved to point at other code). Dependabot
# keeps those pins current and updates the trailing "# v4" comment with the new version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  # The hash-pinned locks in requirements/ are what CI and contributors actually install, so
  # security alerts and updates must cover them, not only the ranges in pyproject.toml. For a
  # full refresh (every pin, re-resolved together), run `python scripts/lock_deps.py --upgrade`.
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
