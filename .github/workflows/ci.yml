name: ci
on: [push, pull_request]
# Least privilege: these jobs only ever read the repository. The release
# workflow is the one that writes, and it asks for that per job.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'
      # The full-screen app tests skip on a guardrail-only install. Here a skip would hide a
      # broken dev extra (it once lacked textual entirely), so fail loudly instead.
      - name: The dev extra must carry the TUI stack
        run: python -c "import textual, pytest_asyncio"
      - run: ruff check src tests demo
      - run: mypy src
      - run: pytest -q --cov=zerotrace --cov-report=xml

  no-egress:
    # The promise is that detection never reaches the network. Prove it: the whole suite runs
    # with every non-loopback connect() blocked, and the build fails if anything tries.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'
      - run: python ci/no_egress.py -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # The build backend comes from the lock too, so the wheel is built with --no-isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/runtime.txt'
      - run: python -m build --no-isolation
      - name: The wheel must carry the rule pack, eval cases and compose file
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("zerotrace/detectors/rules/default.yml",
                         "zerotrace/evals/classifier_cases.jsonl",
                         # `zerotrace model up` has to work without a clone
                         "zerotrace/docker/docker-compose.yml",
                         "zerotrace/docker/ollama-entrypoint.sh"):
              assert needed in names, needed
          print("wheel contents ok")
          PY

  e2e:
    # The install/uninstall flows, run against the real scripts on all three OSes: they build a
    # virtualenv, install the hooks and prove a commit carrying a secret is refused. Windows is
    # the reason this job exists - install.ps1 cannot be run on the machine it is written on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'
      # Docker is played by a fake on PATH (tests/conftest.py), so this needs no daemon - the
      # macOS runner has none and the Windows one cannot run Linux images.
      - name: Install, prove a secret is blocked, uninstall
        env:
          ZEROTRACE_E2E: "1"
        run: pytest -q tests/e2e

  dogfood:
    # ZeroTrace must pass its own scanner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/runtime.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'
      - run: zerotrace scan --all --no-model --fail-on warn
