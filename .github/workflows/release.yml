name: release
# Tags and publishes releases by itself. Three ways to start one:
#
#   1. The "Run workflow" button (Actions > release): pick patch, minor or major and, if you
#      like, a one-line summary. The workflow bumps the version everywhere, moves
#      [Unreleased] in CHANGELOG.md into the new section, commits "chore: prepare vX.Y.Z" to
#      main, then tags and releases it.
#   2. Push a commit to main that raises the version (`python scripts/release.py bump minor`,
#      then commit and push). That version has no tag yet, so it is tagged and released.
#   3. Push a vX.Y.Z tag by hand, as before.
#
# Whichever way: the release commit must pass the whole suite, the wheel must install and
# protect a machine on Linux, macOS AND Windows, the three binaries are built, and only then
# is the tag pushed and one GitHub Release published - as a draft first, so a half-uploaded
# release is never visible. A version that is already released is skipped, so an ordinary push
# or a re-run never publishes twice.
#
# It is one workflow rather than "tag, then a second workflow releases" because GitHub does not
# start workflows for tags or commits pushed with the built-in token: a chained release would
# silently never run.
#
# The whole flow, and how to recover when a step fails, is in docs/RELEASING.md.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]       # only a version change can start a release (tags always run)
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      summary:
        description: One line for the release commit and tag (optional)
        type: string
        required: false

# Read-only by default. Only `bump` (pushes the release commit) and `release` (pushes the tag
# and publishes) get write access, so no build step can write to the repository.
permissions:
  contents: read

# One release at a time; a second run waits instead of racing the first for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write             # pushes "chore: prepare vX.Y.Z" to main
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Releases are cut from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::run the release workflow on main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0          # the tags, to see whether a version is already released

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      # Re-running this workflow after a later job failed must not burn a version number: if
      # main already carries a prepared version that was never tagged, release THAT one.
      - name: Is a prepared version already waiting?
        id: waiting
        run: python scripts/release.py pending >> "$GITHUB_OUTPUT"

      - name: Raise the version and cut the changelog section
        if: steps.waiting.outputs.pending != 'true'
        env:
          BUMP: ${{ inputs.bump }}
        run: python scripts/release.py bump "$BUMP"

      - name: Commit the release to main
        id: commit
        env:
          SUMMARY: ${{ inputs.summary }}
          PENDING: ${{ steps.waiting.outputs.pending }}
          WAITING_TAG: ${{ steps.waiting.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$PENDING" = "true" ]; then
            echo "::notice::$WAITING_TAG is already prepared on main; releasing it"
          else
            version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            message="chore: prepare v$version"
            if [ -n "$SUMMARY" ]; then message="$message - $SUMMARY"; fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --all --message "$message"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plan:
    # Runs after `bump` when there is one, straight away otherwise.
    needs: bump
    if: ${{ !cancelled() && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}
          fetch-depth: 0          # every tag and branch: is this released, and is it on main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Is there a version to release?
        id: plan
        run: |
          set -euo pipefail
          python scripts/release.py plan >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    # The artifacts themselves: the suite, the sdist and wheel, the installers stamped with
    # this version, the hash-locked requirements they install, and the checksums that tie the
    # whole set together.
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'

      - name: The release commit must pass the whole suite
        run: pytest -q

      - name: Build sdist and wheel
        run: python -m build --no-isolation     # build + hatchling come from requirements/dev.txt

      - name: Wheel must carry the rule pack, eval cases and compose file
        run: |
          python - <<'PY'
          import glob
          import zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("zerotrace/detectors/rules/default.yml",
                         "zerotrace/evals/classifier_cases.jsonl",
                         # `zerotrace model up` has to work without a clone
                         "zerotrace/docker/docker-compose.yml",
                         "zerotrace/docker/ollama-entrypoint.sh"):
              assert needed in names, needed
          print("wheel contents ok")
          PY

      - name: Installers stamped with this version, and the lock they install
        run: |
          set -euo pipefail
          python scripts/release.py stamp "$TAG" dist
          cp requirements/install.txt dist/requirements-install.txt

      - name: Release notes from the CHANGELOG
        run: python scripts/release.py notes "$TAG" > release_notes.md

      # One checksum file over everything a person can download, so the installer - and a
      # person - can tell whether what arrived is what was published.
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/*
            release_notes.md
          if-no-files-found: error

  verify-install:
    # The release is only real if it installs. Each runner takes the artifacts this run built
    # and installs from them exactly as a user would, then removes it again. Publication
    # happens after this passes, so a broken installer never reaches a release page.
    needs: [plan, package]
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: assets

      - name: Install from the release assets, on a machine with no model
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export ZEROTRACE_HOME="$RUNNER_TEMP/zt/home"
          export ZEROTRACE_BIN_DIR="$RUNNER_TEMP/zt/bin"
          bash assets/dist/install.sh --from assets/dist --no-model
          "$ZEROTRACE_BIN_DIR/zerotrace" version | grep -q "zerotrace $VERSION"
          test -n "$(git config --global --get core.hooksPath)"
          "$ZEROTRACE_BIN_DIR/zerotrace-uninstall"
          test ! -d "$ZEROTRACE_HOME"
          if git config --global --get core.hooksPath; then
            echo "::error::uninstall left core.hooksPath set"
            exit 1
          fi

      - name: Install from the release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ZEROTRACE_HOME = "$env:RUNNER_TEMP\zt\home"
          $env:ZEROTRACE_BIN_DIR = "$env:RUNNER_TEMP\zt\bin"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File assets/dist/install.ps1 -From assets/dist -NoModel
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $printed = & "$env:ZEROTRACE_BIN_DIR\zerotrace.cmd" version
          if ("$printed" -notmatch "zerotrace $env:VERSION") { throw "got: $printed" }
          & "$env:ZEROTRACE_BIN_DIR\zerotrace-uninstall.cmd"
          if (Test-Path $env:ZEROTRACE_HOME) { throw "uninstall left $env:ZEROTRACE_HOME behind" }

  build-binaries:
    # Single-file PyInstaller binaries so a laptop with no Python can still run zerotrace
    # (docs/DEPLOYMENT.md "No Python on laptops"). One per OS; architecture is whatever the
    # runner's default is (e.g. macos-latest is arm64).
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/release.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'

      - run: pyinstaller zerotrace.spec

      - name: Binary must run with no other install step
        shell: bash
        run: |
          set -euo pipefail
          bin=dist/zerotrace
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --help
          "$bin" doctor || true   # doctor may WARN/FAIL on a bare CI runner; it must not crash

      - name: Name the artifact for this OS/arch
        shell: bash
        run: |
          set -euo pipefail
          src=dist/zerotrace
          ext=""
          [ -f "$src.exe" ] && { src="$src.exe"; ext=".exe"; }
          mkdir -p out
          cp "$src" "out/zerotrace-${{ runner.os }}-${{ runner.arch }}$ext"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zerotrace-${{ runner.os }}-${{ runner.arch }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [plan, package, verify-install, build-binaries]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write             # pushes the annotated tag and publishes the release
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0          # the tags, and the commit subject for the tag message

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: downloaded
          merge-multiple: true

      - name: Collect the assets, with the binaries inside the checksum file
        run: |
          set -euo pipefail
          mkdir -p upload
          cp downloaded/dist/* upload/
          cp downloaded/zerotrace-Linux* downloaded/zerotrace-macOS* \
             downloaded/zerotrace-Windows* upload/
          cd upload
          # The binaries were built by other jobs, so they join the checksum file here.
          sha256sum zerotrace-Linux* zerotrace-macOS* zerotrace-Windows* >> SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Tag the release (annotated), unless the tag was pushed by hand
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists; not re-tagging"
          else
            message=$(python scripts/release.py tag-message "$TAG" "$SHA")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "$message" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      # Draft first, upload, then publish: a release that is half uploaded is never visible,
      # and a re-run repairs an abandoned draft instead of being blocked by it.
      - name: Publish the GitHub release (once)
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo "none")
          if [ "$state" = "false" ]; then
            echo "::notice::the $TAG release is already published; nothing to do"
            exit 0
          fi
          if [ "$state" = "none" ]; then
            gh release create "$TAG" --draft --verify-tag --title "ZeroTrace $TAG" \
              --notes-file downloaded/release_notes.md
          fi
          gh release upload "$TAG" upload/* --clobber
          gh release edit "$TAG" --draft=false --latest
