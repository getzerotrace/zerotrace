name: secret-scan (defense in depth)
on: [push, pull_request]
# Least privilege: these jobs only ever read the repository. The release
# workflow is the one that writes, and it asks for that per job.
permissions:
  contents: read

jobs:
  zerotrace:
    # Same engine as the laptop hook, deterministic only: catches --no-verify and unprotected machines.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/runtime.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: .'
      - name: Scan the commits in this push / PR
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # The base has to be a commit this clone actually has. A first push has none, and a
          # force-push (history rewritten, a branch reset) names one that is no longer
          # reachable - `git log A..B` then fails with "Invalid revision range" and the scan
          # never runs, which is the one outcome a secret scan must not have. Scan everything
          # instead: slower, and it cannot silently skip.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            zerotrace scan --range "$BASE..${{ github.sha }}" --no-model
          else
            echo "::notice::no usable base commit ($BASE); scanning the whole tree"
            zerotrace scan --all --no-model
          fi
  gitleaks:
    # A second, independent engine (ADR 0001). What it reports on our own history, and why each
    # one is not a credential, is in .gitleaks.toml.
    #
    # The gitleaks BINARY, not gitleaks-action: the action refuses to run for an organisation
    # without a paid licence ("[getzerotrace] is an organization. License key is required"),
    # while gitleaks itself is MIT-licensed and free. Downloaded at a pinned version and
    # checked against its published SHA-256 before it is allowed to run - a scanner fetched
    # over the network is the last place to skip that.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Fetch gitleaks, and prove it is the one we pinned
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan the whole history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
