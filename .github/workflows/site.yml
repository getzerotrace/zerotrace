name: site
# Publishes the landing page and the one-line installers to getzerotrace.github.io, which is
# what makes this work:
#
#   curl -fsSL https://getzerotrace.github.io/install.sh | bash
#   irm https://getzerotrace.github.io/install.ps1 | iex
#
# A short URL that does not carry a repository name, loads over HTTPS, and - unlike a bought
# domain - is reachable from a corporate network that blocks unknown domains but allows
# github.io.
#
# What is published:
#   index.html        site/index.html from this repository
#   install.sh        the STAMPED installer from the newest release, so the one-liner installs
#   install.ps1       that release rather than whatever is on main
#   SHA256SUMS        the release's checksums, so a person can verify what they downloaded
#   VERSION           which release the files above came from
#
# Setup, once (docs/INSTALL.md "The short install URL"):
#   1. Create the public repository getzerotrace/getzerotrace.github.io.
#   2. Create a fine-grained personal access token with "Contents: read and write" on THAT
#      repository only, and add it here as the secret SITE_DEPLOY_TOKEN.
#   3. Run this workflow once by hand (Actions > site > Run workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        # Quoted: an unquoted value containing ": " is a YAML mapping error.
        description: "Release to publish the installers from (default: the latest)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SITE_REPO: getzerotrace/getzerotrace.github.io
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Is the deploy token configured?
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo "::error::SITE_DEPLOY_TOKEN is not set, so the site cannot be updated. See the" \
                 "header of .github/workflows/site.yml for the one-time setup."
            exit 1
          fi

      - name: Collect what the site serves
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp site/index.html out/index.html

          # The installers come from the RELEASE, not from this checkout: the release copies
          # are stamped with their own version, so `curl … | bash` installs a released version
          # rather than whatever main happens to be today.
          tag="$TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName --jq .tagName) || tag=""
          fi
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir out \
              --pattern 'install.sh' --pattern 'install.ps1' --pattern 'SHA256SUMS'
            printf '%s\n' "$tag" > out/VERSION
            echo "::notice::publishing the installers from $tag"
          else
            # Before the first release there is nothing stamped to serve. The working copies
            # still install correctly - they resolve the newest release at run time.
            cp install.sh install.ps1 out/
            printf 'main\n' > out/VERSION
            echo "::warning::no release yet; publishing the installers from main"
          fi
          chmod 0755 out/install.sh
          ls -l out

      - name: Push it to the site repository
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/${SITE_REPO}.git" site-repo
          # Only the files this workflow owns are replaced; anything else in the site repository
          # (a CNAME, extra pages) is left exactly where it is.
          cp out/* site-repo/
          cd site-repo
          if git diff --quiet; then
            echo "::notice::the site is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish $(cat VERSION) from ${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}"
          git push
