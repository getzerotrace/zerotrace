# CI-based SonarQube analysis. It exists so coverage reaches the quality gate; Automatic
# Analysis cannot run our tests and therefore always reports 0% coverage on new code.
#
# Before enabling: turn Automatic Analysis OFF in SonarQube Cloud (Administration > Analysis
# Method), add a SONAR_TOKEN repository secret, and set projectKey/organization in
# sonar-project.properties. See docs/SONARQUBE.md.
name: sonar
on:
  push:
    branches: [main]
  pull_request:
# Least privilege: these jobs only ever read the repository. The release
# workflow is the one that writes, and it asks for that per job.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    # `secrets` is not available in a job-level `if`, so gate the scan step on an env copy.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }   # blame data for new-code detection
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      # Dependencies: exact, hash-checked wheels from the lock (scripts/lock_deps.py writes it),
      # so every file is known in advance and nothing runs setup code while it installs.
      # The project itself comes last, from this checkout: no index, no build isolation.
      - run: 'python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt'
      - run: 'python -m pip install --no-deps --no-build-isolation --no-index --only-binary :all: -e .'
      - run: pytest -q --cov=zerotrace --cov-report=xml
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        if: env.SONAR_TOKEN != ''    # no-op until the secret is configured
