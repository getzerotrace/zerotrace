# SonarQube Cloud *Automatic Analysis* configuration.
#
# Automatic Analysis reads this file and ignores sonar-project.properties, which only the
# CI-based scanner (.github/workflows/sonar.yml) reads. Without it every path was analysed as
# production code: the fake credentials in tests/ and demo/fixtures/ were reported as secrets,
# test-only rules were skipped ("sonar.tests is not configured"), and Python was assumed to be
# any 3.x version. Keep the two files in step (docs/SONARQUBE.md).

# Installers and fleet scripts run on developer and managed machines, so they are analysed
# like product code (shell/PowerShell rules), not treated as throwaway tooling. `.github` must
# be listed explicitly once sonar.sources is set, or the workflows' supply-chain rules (pinned
# actions, hash-locked installs) would silently stop running.
sonar.sources=src,ci,scripts,deploy,install.sh,install.ps1,demo/render_fixtures.py,demo/run_demo.sh,demo/run_demo.ps1,.github
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.sourceEncoding=UTF-8

# Template repos rendered into throwaway demo repos. They contain placeholder credentials
# ({{gen:...}}) on purpose and are never imported or executed by the package.
sonar.exclusions=demo/fixtures/**,docs/**,skill/**,.venv/**
