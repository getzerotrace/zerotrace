[project]
name = "zerotrace"
version = "0.2.0"
description = "Local-first pre-commit secret & PII guardrail for every repo on the machine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Tamizhazhagan S" }]
keywords = ["git", "pre-commit", "secrets-detection", "pii", "security", "hooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "detect-secrets>=1.5",
  "rich>=13",
  "pyyaml>=6",
  # The hook's fix menu (arrow keys, Enter, mouse clicks) on every OS, including the legacy
  # Windows console. Pure Python; imported only when a finding needs a decision.
  "prompt_toolkit>=3.0.43",
]

[project.urls]
Homepage = "https://github.com/getzerotrace/zerotrace"
Repository = "https://github.com/getzerotrace/zerotrace"
Issues = "https://github.com/getzerotrace/zerotrace/issues"
Changelog = "https://github.com/getzerotrace/zerotrace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# NER-based PII (Presidio + spaCy). Heavy, so opt-in: `policy.pii.engine: presidio`.
pii-ner = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
llm = []                        # kept for back-compat; the model client is stdlib-only now
# The full-screen apps (`zerotrace review`, `doctor -i`, `exceptions -i`). The git hook never
# imports them, so a machine that only wants the guardrail does not pay for it. The floor is
# the major version the suite runs against: the apps use Textual's own markup (2.0+) and the
# 8.x widget API.
tui = ["textual>=8.0"]
# Pillow is only for scripts/render_logo_assets.py (offline asset generation);
# the runtime logo renderer (ui/logo.py) never imports it.
# Development installs the tui extra too, so `pytest` covers the full-screen apps instead of
# skipping them. CI installs `.[dev]` and checks that the TUI stack imports before testing.
dev = [
  "zerotrace[tui]",
  "pytest", "pytest-cov", "pytest-asyncio>=0.24",
  "mypy", "ruff", "pre-commit", "types-PyYAML", "Pillow",
]

[project.scripts]
zerotrace = "zerotrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zerotrace"]

# The compose file that runs the local model travels with the package: `zerotrace model up`
# has to work on a machine that installed from a release and has no clone. The repo keeps it
# at docker/ so `docker compose -f docker/docker-compose.yml` still works in a checkout.
[tool.hatch.build.targets.wheel.force-include]
"docker/docker-compose.yml" = "zerotrace/docker/docker-compose.yml"
"docker/ollama-entrypoint.sh" = "zerotrace/docker/ollama-entrypoint.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["zerotrace"]
omit = ["*/evals/*"]          # the eval harness needs a live model; measured by hand

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
ignore_missing_imports = true
