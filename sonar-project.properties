# SonarQube Cloud configuration for the CI-based scanner (.github/workflows/sonar.yml).
# Automatic Analysis reads .sonarcloud.properties instead; keep the two in step.
#
# Without this file every path is analysed as production source, so the intentionally fake
# credentials in the test suite and in the demo fixtures are reported as hard-coded secrets.
# They are deliberate: this project's tests need format-valid fake tokens, and the demo repos
# exist to be blocked on stage. Real values are never stored; both are generated at run time
# (tests/conftest.py::Fake and demo/render_fixtures.py).

# Automatic Analysis already knows the project, so the key/organization are only needed if we
# ever switch to the CI-based scanner. Copy the exact values from SonarQube Cloud >
# Information before uncommenting: a wrong key fails the analysis.
# sonar.projectKey=getzerotrace_zerotrace   (confirmed from the IDE binding)
# sonar.organization=<copy from SonarQube Cloud > Organization > Key>

# Installers and fleet scripts run on developer and managed machines, so they are analysed
# like product code (shell/PowerShell rules), not treated as throwaway tooling. `.github` is
# listed so the workflows' supply-chain rules keep running once sonar.sources is set.
sonar.sources=src,ci,scripts,deploy,install.sh,install.ps1,demo/render_fixtures.py,demo/run_demo.sh,demo/run_demo.ps1,.github
sonar.tests=tests
sonar.python.version=3.11,3.12,3.13
sonar.sourceEncoding=UTF-8
sonar.python.coverage.reportPaths=coverage.xml

# Template repos rendered into throwaway demo repos. They contain placeholder credentials
# ({{gen:...}}) on purpose and are never imported or executed by the package.
sonar.exclusions=demo/fixtures/**,docs/**,skill/**,.venv/**

# Note: no rule-level exclusions are configured. The Security finding that failed the gate was
# unpinned GitHub Actions (fixed by pinning to commit SHAs), not the detector rule material.
# If Sonar flags the credential-shaped patterns in src/zerotrace/detectors/, review them before
# excluding anything: they are the product, but a real issue could hide among them.
